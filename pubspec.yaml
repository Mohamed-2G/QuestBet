name: questbet
description: QuestBet - A gamified productivity app that turns your goals into quests.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Your project dependencies
  provider: ^6.1.2
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  intl: ^0.19.0
  google_fonts: ^6.1.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  firebase_storage: ^12.3.4
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/achievements/
    - assets/avatars/